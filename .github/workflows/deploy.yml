name: Veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'   # täglich; tcgcsv.com baut seine Daten gegen 20:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Termine von der Live-Seite holen (bei Push kein neuer Abruf)
        run: curl -fsSL "https://anlactrieu.github.io/sammelmappe/releases.json" -o public/releases.json.live && mv public/releases.json.live public/releases.json || rm -f public/releases.json.live
      - name: Aktuellen Katalog von der Live-Seite holen (kein erneuter Abruf bei jedem Push)
        run: curl -fsSL "https://anlactrieu.github.io/sammelmappe/catalog.json" -o public/catalog.json.live && mv public/catalog.json.live public/catalog.json || rm -f public/catalog.json.live
      - name: Produktkatalog erneuern (nur nachts bzw. von Hand – tcgcsv.com erlaubt höchstens 1 Abruf/Tag)
        if: github.event_name != 'push'
        run: npm run catalog
      - name: Erscheinungstermine erneuern (nur nachts bzw. von Hand)
        if: github.event_name != 'push'
        run: npm run releases
      - run: npm run embeddings     # Bild-Vektoren für die Foto-Suche (nur neue Produkte werden berechnet)
      - name: Karten-Index vom Daten-Branch holen (falls vorhanden)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/cards-emb.json" -o public/cards-emb.json && curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/cards-emb.bin" -o public/cards-emb.bin || rm -f public/cards-emb.json public/cards-emb.bin
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
